<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Cumple Magaly 🎂</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cc7a;
      --cream: #fdf6e8;
      --rose: #c2616e;
      --rose-dark: #8b3a44;
      --deep: #1a0a0d;
      --text: #3a1a1f;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      background: var(--deep);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* ── BACKGROUND ─────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(194,97,110,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(139,58,68,0.2) 0%, transparent 70%),
        #0e0508;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── FLOATING PETALS ─────────────────────────────── */
    .petal {
      position: fixed;
      top: -30px;
      font-size: 1.2rem;
      opacity: 0;
      animation: fall linear infinite;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(201,168,76,0.6));
    }
    @keyframes fall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ── WRAPPER ────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
    }

    /* ── CARD ───────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, rgba(253,246,232,0.07) 0%, rgba(253,246,232,0.03) 100%);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 2px;
      padding: 2.5rem 1.8rem 3rem;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 30px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      animation: cardIn 1.2s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── ORNAMENT TOP ───────────────────────────────── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s ease both;
    }
    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .ornament-icon { font-size: 1.1rem; filter: drop-shadow(0 0 8px var(--gold)); }

    /* ── TITLE ──────────────────────────────────────── */
    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: var(--gold-light);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s ease both;
    }

    .name-wrap {
      position: relative;
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.9s ease both;
    }
    .feliz {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2rem, 9vw, 3rem);
      color: var(--cream);
      line-height: 1;
      letter-spacing: -0.01em;
      text-shadow: 0 0 40px rgba(232,204,122,0.3);
    }
    .cumple {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      color: var(--gold-light);
      display: block;
      line-height: 1.1;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 13vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, #fff6d0 70%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 20px rgba(201,168,76,0.5));
      margin-bottom: 0.2rem;
      opacity: 0;
      animation: fadeUp 0.9s 1.1s ease both, shimmer 4s 2s linear infinite;
      background-size: 200% auto;
    }
    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .exclaim {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      color: var(--rose);
      opacity: 0;
      animation: fadeUp 0.8s 1.2s ease both;
      text-shadow: 0 0 30px rgba(194,97,110,0.4);
    }

    /* ── DIVIDER ────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.6rem auto;
      max-width: 260px;
      opacity: 0;
      animation: fadeUp 0.8s 1.4s ease both;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,0.4), transparent);
    }
    .divider-icon { font-size: 1.4rem; filter: drop-shadow(0 0 10px var(--rose)); }

    /* ── MESSAGE ────────────────────────────────────── */
    .message {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.05rem, 4.5vw, 1.35rem);
      color: rgba(253,246,232,0.85);
      line-height: 1.75;
      letter-spacing: 0.01em;
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.9s 1.6s ease both;
    }
    .message strong {
      font-style: normal;
      font-weight: 600;
      color: var(--cream);
      font-size: 1.05em;
    }

    /* ── FIRMA ──────────────────────────────────────── */
    .firma {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: var(--gold);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 0.8s 1.9s ease both;
      text-shadow: 0 0 20px rgba(201,168,76,0.4);
    }

    /* ── BOTTOM ORNAMENT ─────────────────────────────── */
    .ornament-bottom {
      margin-top: 2rem;
      opacity: 0;
      animation: fadeUp 0.8s 2.1s ease both;
    }

    /* ── GLOW PULSE ─────────────────────────────────── */
    .glow-ring {
      position: absolute;
      inset: -2px;
      border-radius: 3px;
      background: transparent;
      border: 1px solid transparent;
      animation: glowPulse 3s 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); border-color: transparent; }
      50%       { box-shadow: 0 0 30px 4px rgba(201,168,76,0.2); border-color: rgba(201,168,76,0.15); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── STARS ──────────────────────────────────────── */
    .star {
      position: fixed;
      width: 2px;
      height: 2px;
      background: var(--gold-light);
      border-radius: 50%;
      opacity: 0;
      animation: twinkle ease-in-out infinite;
      z-index: 1;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(1.8); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrapper">
    <div class="card" style="position:relative;">
      <div class="glow-ring"></div>

      <div class="ornament">
        <div class="ornament-line"></div>
        <span class="ornament-icon">✦</span>
        <span class="ornament-icon">🌹</span>
        <span class="ornament-icon">✦</span>
        <div class="ornament-line"></div>
      </div>

      <p class="greeting">con todo el amor del mundo</p>

      <div class="name-wrap">
        <span class="feliz">Feliz</span>
        <span class="cumple">Cumpleaños</span>
      </div>

      <div class="name">Magaly</div>
      <div class="exclaim">!!!</div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-icon">🎂</span>
        <div class="divider-line"></div>
      </div>

      <p class="message">
        Te amamos muchísimo,<br/>
        <strong>tu mamá y tu hermano.</strong><br/>
        Que pases un día tan lindo<br/>
        como vos —<br/>
        te lo merecés con creces. 🌸
      </p>

      <p class="firma">Con todo nuestro amor ♡</p>

      <div class="ornament-bottom">
        <div class="ornament">
          <div class="ornament-line"></div>
          <span class="ornament-icon">✦</span>
          <span class="ornament-icon">✨</span>
          <span class="ornament-icon">✦</span>
          <div class="ornament-line"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Falling petals / sparkles ──────────────────────
    const symbols = ['✨','🌹','🌸','✦','💛','🎀','🌺'];
    function createPetal() {
      const el = document.createElement('div');
      el.className = 'petal';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + 'vw';
      const dur = 6 + Math.random() * 8;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = Math.random() * 5 + 's';
      el.style.fontSize = (0.9 + Math.random() * 0.8) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), (dur + 6) * 1000);
    }
    setInterval(createPetal, 700);
    for (let i = 0; i < 6; i++) createPetal();

    // ── Background stars ───────────────────────────────
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = (2 + Math.random() * 4) + 's';
      s.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
